version: 2
updates:
  # SHA-pinned actions and the digest-pinned base image only stay safe if someone bumps them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The sample matcher's base image and exact Python pins.
  - package-ecosystem: docker
    directory: /matcher
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /matcher
    schedule:
      interval: weekly
