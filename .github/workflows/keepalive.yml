name: Keepalive

# Upstash deletes free databases after 14 days without commands (found deleted on 2026-11-01).
# One request for a fixed report is a single Redis GET once it is cached (30-day TTL),
# so this costs no LLM/Tavily quota except one fresh run per month.
on:
  schedule:
    - cron: '23 14 */5 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Touch the production cache
        run: |
          body=$(curl -sS --max-time 120 \
            'https://spot-on-six.vercel.app/api/research-song?trackId=keepalive&name=Clair%20de%20Lune&artist=Claude%20Debussy')
          if printf '%s' "$body" | grep -q '^event: report'; then
            echo "Cache reachable; report served."
          else
            echo "::error::No report from production. Check the Upstash console (database deleted?) and the Vercel logs."
            printf '%s\n' "$body" | head -5
            exit 1
          fi
