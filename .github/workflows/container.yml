name: Container

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Weekly rescan: new CVEs appear without any code change.
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit SHAs, not tags: in March 2026 most trivy-action
# tags were force-pushed to credential-stealing code (CVE-2026-33634). Dependabot bumps them.
env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  verify:
    name: Build, smoke test, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: spoton:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke-test.sh spoton:ci

      - name: Scan for fixable HIGH/CRITICAL vulnerabilities
        # The scanner runs as a digest-pinned container with no token and no Docker
        # socket; it only sees an exported copy of the image.
        run: |
          docker save spoton:ci -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" "$TRIVY_IMAGE" \
            image --input /image.tar --severity HIGH,CRITICAL --ignore-unfixed \
            --no-progress --exit-code 1

  matcher:
    name: Matcher tests, smoke test, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The test stage runs pytest (synthetic known-answer audio, URL guard, HTTP contract) at build time.
      - name: Unit tests (image test stage)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: matcher
          target: test
          cache-from: type=gha,scope=matcher
          cache-to: type=gha,mode=max,scope=matcher

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: matcher
          load: true
          tags: spoton-matcher:ci
          cache-from: type=gha,scope=matcher

      - name: Smoke test
        run: scripts/smoke-test-matcher.sh spoton-matcher:ci

      - name: Scan for fixable HIGH/CRITICAL vulnerabilities
        run: |
          docker save spoton-matcher:ci -o "$RUNNER_TEMP/matcher.tar"
          docker run --rm -v "$RUNNER_TEMP/matcher.tar:/image.tar:ro" "$TRIVY_IMAGE" \
            image --input /image.tar --severity HIGH,CRITICAL --ignore-unfixed \
            --no-progress --exit-code 1

  publish:
    name: Publish image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR push
      id-token: write # exchange GitHub's OIDC token for short-lived Google credentials
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      # Empty until infra/terraform is applied and its github_variables are set.
      AR_IMAGE: ${{ vars.GCP_PROJECT_ID && format('{0}-docker.pkg.dev/{1}/spoton/spoton', vars.GCP_REGION, vars.GCP_PROJECT_ID) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: gcp
        if: env.AR_IMAGE != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - if: env.AR_IMAGE != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/spoton
            ${{ env.AR_IMAGE }}
          # Immutable tags only: deploys reference an exact commit, never "latest".
          tags: type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public value (it ships in the browser bundle): a repository variable, not a secret.
          build-args: VITE_SPOTIFY_CLIENT_ID=${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy to Cloud Run
    needs: publish
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    # Never overlap with another deploy or the rollback drill: Cloud Run rejects concurrent changes.
    concurrency:
      group: cloud-run-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/spoton/spoton@${{ needs.publish.outputs.digest }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Roll out, smoke test, roll back on failure
        run: scripts/cloud-run-deploy.sh
