# Overlay for load tests: docker compose -f compose.yaml -f loadtest/compose.load.yaml up -d --build
# App sized like the Cloud Run service (1 vCPU, 512 MiB); LLM replaced by a mock; no real keys.
services:
  app:
    env_file: !reset []
    environment:
      LLM_BASE_URL: http://mock-llm:8081
      LLM_API_KEY: load-test
      TAVILY_API_KEY: ""
      GENIUS_ACCESS_TOKEN: ""
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_CLIENT_SECRET: ""
      # Load tests measure the service, not the limiter.
      RESEARCH_LIMIT_PER_IP_HOUR: "1000000"
      RESEARCH_LIMIT_GLOBAL_PER_DAY: "1000000"
      # Results in README.md were measured without per-request log lines.
      LOG_REQUESTS: "0"
    cpus: 1
    mem_limit: 512m
    depends_on:
      - redis-http
      - mock-llm

  mock-llm:
    image: node:24-alpine@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
    command: ["node", "/mock/mock-llm.mjs"]
    environment:
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-3000}
    volumes:
      - ./loadtest/mock-llm.mjs:/mock/mock-llm.mjs:ro
    ports:
      - "127.0.0.1:8081:8081"
